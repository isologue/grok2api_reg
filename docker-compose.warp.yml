services:
  # ── Init: 写入代理配置到 config.toml ──────────────────────────────────────
  init-config:
    image: python:3.13-alpine
    volumes:
      - ./data:/app/data
      - ./scripts:/scripts:ro
    command: ["python3", "/scripts/init_proxy_config.py"]
    restart: "no"

  # ── WARP: Cloudflare 出口代理 ─────────────────────────────────────────────
  warp-proxy:
    image: caomingjun/warp:latest
    container_name: warp-proxy
    restart: unless-stopped
    environment:
      # warp-svc 在网络较慢或首次注册时可能超过 2 秒才创建控制 socket。
      # 等待时间过短会让 entrypoint 的 warp-cli 直接失败并触发容器重启。
      WARP_SLEEP: "${WARP_SLEEP:-10}"
    healthcheck:
      test: ["CMD-SHELL", "bash /healthcheck/index.sh"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1

  # ── Privoxy: HTTP 代理，转发到 WARP SOCKS5 ───────────────────────────────
  privoxy:
    image: ghcr.io/jiujiu532/privoxy-warp:latest
    container_name: privoxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:40081:8118"
    depends_on:
      warp-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8118"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── FlareSolverr: 自动解 Cloudflare 挑战 ────────────────────────────────
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: info

  # ── grok2api ──────────────────────────────────────────────────────────────
  grok2api:
    # Registration needs Chromium, so build the local extended image.
    build:
      context: .
      dockerfile: Dockerfile.registration
      args:
        # 可通过 DEBIAN_MIRROR 覆盖 Debian 软件源；国内网络默认使用阿里云镜像。
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com}
    container_name: grok2api
    # Reap short-lived Chromium/Xvfb descendants from CPA browser fallback.
    init: true
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:${SERVER_PORT:-8000}"
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONIOENCODING: utf-8
      PYTHONWARNINGS: "ignore:invalid escape sequence:SyntaxWarning"
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8000}
      # Keep one worker so registration task state remains consistent.
      SERVER_WORKERS: "1"
      # Optional stable key for encrypted registration archives. Empty uses data/registration/archive.key.
      REGISTRATION_ARCHIVE_KEY: ${REGISTRATION_ARCHIVE_KEY:-}
      ACCOUNT_STORAGE: ${ACCOUNT_STORAGE:-local}
      ACCOUNT_LOCAL_PATH: ${ACCOUNT_LOCAL_PATH:-data/accounts.db}
      ACCOUNT_REDIS_URL: ${ACCOUNT_REDIS_URL:-}
      ACCOUNT_MYSQL_URL: ${ACCOUNT_MYSQL_URL:-}
      ACCOUNT_POSTGRESQL_URL: ${ACCOUNT_POSTGRESQL_URL:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Chromium needs extra shared memory inside the container.
    shm_size: 1gb
    depends_on:
      init-config:
        condition: service_completed_successfully
      warp-proxy:
        condition: service_healthy
      privoxy:
        condition: service_healthy
      flaresolverr:
        condition: service_started
