<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grok Build</title><link href="/static/css/app.css" rel="stylesheet"><style>.wrap{max-width:1180px;margin:32px auto;padding:0 22px}.head{margin-bottom:18px}.head h1{margin:0;font-size:24px}.sub,.muted{color:#777;font-size:13px}.card{background:#fff;border:1px solid #e7e7e7;border-radius:12px;padding:16px;margin-bottom:14px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{border:1px solid #ddd;background:#fff;padding:7px 10px;border-radius:7px;cursor:pointer}.btn.primary{background:#111;color:#fff;border-color:#111}.btn.danger{color:#b42318}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;word-break:break-word}</style></head>
<body><div id="admin-header"></div><main class="wrap"><section class="head"><h1>Grok Build 账号池</h1><p class="sub">导入 CPA Auth JSON / ZIP。同步模型后，账号才会出现在 /v1/models。</p></section><section class="card"><form id="import-form" class="bar"><input id="file" type="file" accept=".json,.zip" required><button class="btn primary">导入 CPA Auth</button><span id="notice" class="muted"></span></form></section><section class="card"><div class="bar"><strong>账号</strong><button class="btn" id="reload">刷新</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>邮箱 / 用户 ID</th><th>状态</th><th>模型</th><th>Token 到期</th><th>最近错误</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="/static/js/i18n.js?v={{APP_VERSION}}"></script><script src="/static/js/auth.js?v={{APP_VERSION}}"></script><script src="/static/js/admin-header.js?v={{APP_VERSION}}"></script><script>
const api=async(u,o={})=>{const key=typeof adminKey!=='undefined'?await adminKey.get():'';const r=await fetch('/admin/api/build'+u,{...o,headers:{Authorization:'Bearer '+key,...(o.headers||{})}});if(!r.ok){let message='Request failed ('+r.status+')';try{const data=await r.json();message=data.detail||data.error?.message||message}catch{}throw new Error(message)}return r};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await api('/accounts');const d=await r.json();document.querySelector('#rows').innerHTML=(d.items||[]).map(a=>`<tr><td>${esc(a.email||a.user_id||a.id)}</td><td>${a.enabled?'启用':'停用'}</td><td>${esc((a.models||[]).join(', ')||'未同步')}</td><td>${a.expires_at?new Date(a.expires_at).toLocaleString():'未知'}</td><td>${esc(a.last_error)}</td><td><button class="btn" onclick="sync('${a.id}')">同步模型</button> <button class="btn" onclick="toggle('${a.id}',${!a.enabled})">${a.enabled?'停用':'启用'}</button> <button class="btn danger" onclick="del('${a.id}')">删除</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">暂无已导入的 CPA Auth 账号。</td></tr>'}catch(error){document.querySelector('#notice').textContent='加载失败：'+error.message;document.querySelector('#rows').innerHTML='<tr><td colspan="6" class="muted">无法读取账号池，请重新登录后再刷新。</td></tr>'}}
async function sync(id){const r=await api('/accounts/'+id+'/sync',{method:'POST'});if(!r.ok)alert((await r.text())||'同步失败');load()} async function toggle(id,enabled){await api('/accounts/'+id+'/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});load()} async function del(id){if(confirm('确认删除该 Build 账号？')){await api('/accounts',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[id]})});load()}} document.querySelector('#reload').onclick=load;document.querySelector('#import-form').onsubmit=async e=>{e.preventDefault();const f=document.querySelector('#file').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);const r=await api('/import',{method:'POST',body:fd});document.querySelector('#notice').textContent=r.ok?'导入成功，请点击“同步模型”以启用。':'导入失败：'+await r.text();if(r.ok)load()};load();
</script></body></html>
