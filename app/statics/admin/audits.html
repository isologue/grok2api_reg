<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>请求审计</title><link rel="stylesheet" href="/static/css/app.css?v={{APP_VERSION}}"><style>.audit-card{background:var(--bg-card,#fff);border:1px solid var(--border,#e8e3da);border-radius:12px;padding:16px}.audit-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.audit-toolbar input,.audit-toolbar select{min-height:34px;border:1px solid #ddd4c8;border-radius:8px;padding:0 10px;background:#fff}.audit-toolbar input{min-width:260px}.audit-toolbar button{border:0;border-radius:8px;padding:0 13px;background:#2f6fed;color:#fff;cursor:pointer}.audit-table{width:100%;border-collapse:collapse;font-size:13px}.audit-table th,.audit-table td{border-bottom:1px solid #f0ede8;padding:10px 8px;text-align:left;vertical-align:top;word-break:break-word}.audit-table th{font-size:11px;color:#888;font-weight:600}.status-ok{color:#16824b}.status-bad{color:#b42318}.detail{max-width:360px;white-space:pre-wrap;color:#666}.audit-detail-btn{height:28px;padding:0 10px;border:1px solid #e1dbd0;border-radius:7px;background:#fff;color:#4d473f;font-size:12px;cursor:pointer;white-space:nowrap}.audit-detail-btn:hover{background:#f6f3ed;border-color:#d5ccbe}.audit-log-pre{margin:0;max-height:62vh;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#171717;color:#eee;border-radius:8px;padding:12px;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pill{background:#f5f2ec;border-radius:999px;padding:5px 10px;font-size:12px;color:#5f584d}.pagi{display:flex;align-items:center;gap:6px;padding:12px 0 0;justify-content:flex-end}.pagi-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:#8b8b8b}.pagi-page{font-variant-numeric:tabular-nums;white-space:nowrap}.pagi-btn{width:28px;height:28px;border:1px solid #e6e1d8;border-radius:8px;background:#fff;color:#666;font-size:16px;line-height:1;cursor:pointer}.pagi-btn:hover{background:#f6f3ed}.pagi-btn:disabled{opacity:.35;pointer-events:none}.audit-pagi{margin-top:12px}.audit-page-size{width:94px;height:28px;border-radius:999px;font:inherit;color:inherit;background:#fafafa;border:1px solid transparent}.audit-page-size:focus{outline:none;border-color:#ddd4c8}.audit-page-info{font-size:12px;color:#888;white-space:nowrap}</style></head><body><div id="admin-header"></div><main class="admin-main"><div class="page-hd"><div><div class="page-title">请求审计</div><div class="page-sub">查看 Grok Build 请求的账号、模型路由、状态、耗时与失败详情。敏感字段已脱敏。</div></div></div><section class="audit-card"><div class="summary"><span id="sum-total" class="pill">总请求 0</span><span id="sum-ok" class="pill">成功 0</span><span id="sum-fail" class="pill">失败 0</span></div><div class="audit-toolbar"><input id="q" placeholder="搜索模型、账号或错误"><select id="provider"><option value="">全部提供方</option><option value="build">Grok Build</option><option value="grok">Grok</option><option value="console">Console</option><option value="image">Image</option><option value="video">Video</option></select><select id="status"><option value="">全部状态</option><option value="200">成功 (200)</option><option value="401">401</option><option value="403">403</option><option value="429">429</option><option value="5xx">5xx</option></select><button id="reload">刷新</button></div><div style="overflow:auto"><table class="audit-table"><thead><tr><th>时间</th><th>提供方 / 操作</th><th>模型路由</th><th>账号</th><th>状态</th><th>耗时</th><th>详情</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagi audit-pagi" id="audit-pagi"><button type="button" class="pagi-btn" id="audit-prev" aria-label="Previous page">&#8249;</button><div class="pagi-meta"><span class="pagi-page audit-page-info" id="audit-page-info">0 / 0</span><select class="audit-page-size" id="audit-page-size" aria-label="Audit page size"><option value="10">10 / &#39029;</option><option value="20">20 / &#39029;</option><option value="50">50 / &#39029;</option><option value="100">100 / &#39029;</option><option value="200">200 / &#39029;</option><option value="500">500 / &#39029;</option><option value="1000">1000 / &#39029;</option><option value="2000">2000 / &#39029;</option></select></div><button type="button" class="pagi-btn" id="audit-next" aria-label="Next page">&#8250;</button></div></section></main><div class="modal-overlay" id="modal-audit-detail" aria-hidden="true"><div class="modal" style="max-width:980px"><div class="modal-title" id="audit-detail-title">&#35831;&#27714;&#23457;&#35745;&#35814;&#24773;</div><div class="dialog-body"><pre class="audit-log-pre" id="audit-detail-content"></pre></div><div class="dialog-actions"><button type="button" class="dialog-btn" id="audit-detail-close">&#20851;&#38381;</button></div></div></div><script src="/static/js/i18n.js?v={APP_VERSION}"></script><script src="/static/js/auth.js?v={{APP_VERSION}}"></script><script src="/static/js/admin-header.js?v={{APP_VERSION}}"></script><script src="/static/js/footer.js?v={{APP_VERSION}}"></script><script>
const AUDIT_TEXT={
  title:'\u8bf7\u6c42\u5ba1\u8ba1', subtitle:'\u67e5\u770b Grok Build \u8bf7\u6c42\u7684\u8d26\u53f7\u3001\u6a21\u578b\u8def\u7531\u3001\u72b6\u6001\u3001\u8017\u65f6\u4e0e\u5931\u8d25\u8be6\u60c5\u3002\u654f\u611f\u5b57\u6bb5\u5df2\u8131\u654f\u3002',
  total:'\u603b\u8bf7\u6c42', success:'\u6210\u529f', failed:'\u5931\u8d25', upstream:'\u4e0a\u6e38', request:'\u8bf7\u6c42', response:'\u8fd4\u56de', error:'\u9519\u8bef', detail:'\u8be6\u60c5', viewLog:'\u67e5\u770b\u5168\u90e8\u65e5\u5fd7', detailTitle:'\u8bf7\u6c42\u5ba1\u8ba1\u8be6\u60c5', detailLoading:'\u6b63\u5728\u52a0\u8f7d\u5b8c\u6574\u8bf7\u6c42\u65e5\u5fd7\u2026', detailLoadFailed:'\u52a0\u8f7d\u8bf7\u6c42\u65e5\u5fd7\u5931\u8d25\uff1a', id:'ID', provider:'\u63d0\u4f9b\u65b9', operation:'\u64cd\u4f5c', publicModel:'\u516c\u5f00\u6a21\u578b', upstreamModel:'\u4e0a\u6e38\u6a21\u578b', account:'\u8d26\u53f7', endpoint:'\u4e0a\u6e38\u5730\u5740', status:'\u72b6\u6001\u7801', streaming:'\u6d41\u5f0f', duration:'\u8017\u65f6', yes:'\u662f', no:'\u5426', empty:'\u6682\u65e0\u5ba1\u8ba1\u8bb0\u5f55', loadFailed:'\u5ba1\u8ba1\u8bb0\u5f55\u52a0\u8f7d\u5931\u8d25\uff1a', page:'\u7b2c', pageOf:'/', pageSuffix:'\u9875'
};
const PAGE_SIZE_KEY='admin.request_audits.page_size';
const PAGE_SIZE_OPTIONS=[10,20,50,100,200,500,1000,2000];
let auditPage=1;
let auditPageSize=Number(localStorage.getItem(PAGE_SIZE_KEY))||50;
let auditTotal=0;
let auditTotalPages=1;
const api=async path=>{const key=await adminKey.get();const r=await fetch('/admin/api/audits'+path,{headers:{Authorization:`Bearer ${key}`}});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||`HTTP ${r.status}`);return r.json()};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prettyJson=v=>{if(v==null)return '-';if(typeof v==='string')return v;try{return JSON.stringify(v,null,2)}catch{return String(v)}};
function queryArgs(){return new URLSearchParams({page:String(auditPage),page_size:String(auditPageSize),query:document.querySelector('#q').value.trim(),provider:document.querySelector('#provider').value,status:document.querySelector('#status').value});}
function renderRows(items){
  const body=document.querySelector('#rows');
  body.innerHTML=(items||[]).map(x=>`<tr><td>${x.created_at?new Date(x.created_at).toLocaleString():'-'}</td><td>${esc(x.provider)}<br><span class="detail">${esc(x.operation)}</span></td><td>${esc(x.public_model)}<br><span class="detail">${AUDIT_TEXT.upstream} ${esc(x.upstream_model)}</span></td><td>${esc(x.account)}</td><td class="${x.status_code>=400?'status-bad':'status-ok'}">${esc(x.status_code)}</td><td>${esc(x.duration_ms)} ms</td><td><button type="button" class="audit-detail-btn" data-audit-id="${esc(x.id)}">${AUDIT_TEXT.viewLog}</button></td></tr>`).join('')||`<tr><td colspan="7" style="color:#888">${AUDIT_TEXT.empty}</td></tr>`;
}
function renderPagination(){const info=document.querySelector('#audit-page-info'),prev=document.querySelector('#audit-prev'),next=document.querySelector('#audit-next');if(info)info.textContent=`${AUDIT_TEXT.page} ${auditTotal?auditPage:0} ${AUDIT_TEXT.pageOf} ${auditTotalPages} ${AUDIT_TEXT.pageSuffix}`;if(prev)prev.disabled=auditPage<=1;if(next)next.disabled=auditPage>=auditTotalPages;}
async function load({reset=false}={}){if(reset)auditPage=1;try{const [data,sum]=await Promise.all([api(`?${queryArgs().toString()}`),api('/summary')]);auditTotal=Number(data.total||0);auditTotalPages=Math.max(1,Number(data.total_pages||1));auditPage=Math.min(Math.max(1,Number(data.page||auditPage)),auditTotalPages);document.querySelector('#sum-total').textContent=`${AUDIT_TEXT.total} ${sum.total||0}`;document.querySelector('#sum-ok').textContent=`${AUDIT_TEXT.success} ${sum.success||0}`;document.querySelector('#sum-fail').textContent=`${AUDIT_TEXT.failed} ${sum.failed||0}`;renderRows(data.items);renderPagination()}catch(e){document.querySelector('#rows').innerHTML=`<tr><td colspan="7" style="color:#b42318">${AUDIT_TEXT.loadFailed}${esc(e.message)}</td></tr>`;auditTotal=0;auditTotalPages=1;renderPagination()}}
function changeAuditPage(delta){const target=auditPage+(Number(delta)||0);if(target<1||target>auditTotalPages)return;auditPage=target;load()}
function setAuditPageSize(value){const size=Number(value);auditPageSize=PAGE_SIZE_OPTIONS.includes(size)?size:50;localStorage.setItem(PAGE_SIZE_KEY,String(auditPageSize));load({reset:true})}
function formatAuditDetail(item){
  const created=item.created_at?new Date(item.created_at).toLocaleString():'-';
  const header=[
    `${AUDIT_TEXT.id}: ${item.id||'-'}`,
    `\n${AUDIT_TEXT.provider}: ${item.provider||'-'}`,
    `${AUDIT_TEXT.operation}: ${item.operation||'-'}`,
    `${AUDIT_TEXT.publicModel}: ${item.public_model||'-'}`,
    `${AUDIT_TEXT.upstreamModel}: ${item.upstream_model||'-'}`,
    `${AUDIT_TEXT.account}: ${item.account||'-'}`,
    `${AUDIT_TEXT.endpoint}: ${item.endpoint||'-'}`,
    `${AUDIT_TEXT.status}: ${item.status_code??'-'}`,
    `${AUDIT_TEXT.streaming}: ${item.streaming?AUDIT_TEXT.yes:AUDIT_TEXT.no}`,
    `${AUDIT_TEXT.duration}: ${item.duration_ms??0} ms`,
    `\n${created}`,
  ].join('\n');
  return `${header}\n\n===== ${AUDIT_TEXT.request} =====\n${prettyJson(item.request)}\n\n===== ${AUDIT_TEXT.response} =====\n${prettyJson(item.response)}${item.error?`\n\n===== ${AUDIT_TEXT.error} =====\n${item.error}`:''}`;
}
function openAuditDetailModal(){const modal=document.querySelector('#modal-audit-detail');if(!modal)return;modal.classList.add('open');modal.setAttribute('aria-hidden','false')}
function closeAuditDetailModal(){const modal=document.querySelector('#modal-audit-detail');if(!modal)return;modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}
async function openAuditDetail(auditId){
  const title=document.querySelector('#audit-detail-title'),content=document.querySelector('#audit-detail-content');
  if(title)title.textContent=AUDIT_TEXT.detailTitle;
  if(content)content.textContent=AUDIT_TEXT.detailLoading;
  openAuditDetailModal();
  try{
    const item=await api(`/${encodeURIComponent(auditId)}`);
    if(title)title.textContent=`${AUDIT_TEXT.detailTitle} - ${item.id||auditId}`;
    if(content)content.textContent=formatAuditDetail(item);
  }catch(error){
    if(content)content.textContent=`${AUDIT_TEXT.detailLoadFailed}${error.message}`;
  }
}
document.querySelector('#rows').addEventListener('click',event=>{const button=event.target.closest('[data-audit-id]');if(button)openAuditDetail(button.dataset.auditId)});
document.querySelector('#audit-detail-close').onclick=closeAuditDetailModal;
document.querySelector('#modal-audit-detail').addEventListener('click',event=>{if(event.target===event.currentTarget)closeAuditDetailModal()});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeAuditDetailModal()});
document.querySelector('#reload').onclick=()=>load();
document.querySelector('#q').addEventListener('keydown',e=>{if(e.key==='Enter')load({reset:true})});
document.querySelector('#provider').onchange=()=>load({reset:true});
document.querySelector('#status').onchange=()=>load({reset:true});
document.querySelector('#audit-prev').onclick=()=>changeAuditPage(-1);
document.querySelector('#audit-next').onclick=()=>changeAuditPage(1);
const pageSizeSelect=document.querySelector('#audit-page-size');if(pageSizeSelect){auditPageSize=PAGE_SIZE_OPTIONS.includes(auditPageSize)?auditPageSize:50;pageSizeSelect.value=String(auditPageSize);pageSizeSelect.onchange=e=>setAuditPageSize(e.target.value)}
(async()=>{await renderAdminHeader?.();await renderSiteFooter?.();const key=await adminKey.get();if(!key||!await verifyKey('/admin/api/verify',key).catch(()=>false)){location.href='/admin/login';return}load()})();
</script></body></html>
