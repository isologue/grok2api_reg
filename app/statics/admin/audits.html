<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>请求审计</title><link rel="stylesheet" href="/static/css/app.css?v={{APP_VERSION}}"><style>.audit-card{background:var(--bg-card,#fff);border:1px solid var(--border,#e8e3da);border-radius:12px;padding:16px}.audit-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.audit-toolbar input,.audit-toolbar select{min-height:34px;border:1px solid #ddd4c8;border-radius:8px;padding:0 10px;background:#fff}.audit-toolbar input{min-width:260px}.audit-toolbar button{border:0;border-radius:8px;padding:0 13px;background:#2f6fed;color:#fff;cursor:pointer}.audit-table{width:100%;border-collapse:collapse;font-size:13px}.audit-table th,.audit-table td{border-bottom:1px solid #f0ede8;padding:10px 8px;text-align:left;vertical-align:top;word-break:break-word}.audit-table th{font-size:11px;color:#888;font-weight:600}.status-ok{color:#16824b}.status-bad{color:#b42318}.detail{max-width:360px;white-space:pre-wrap;color:#666}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pill{background:#f5f2ec;border-radius:999px;padding:5px 10px;font-size:12px;color:#5f584d}</style></head><body><div id="admin-header"></div><main class="admin-main"><div class="page-hd"><div><div class="page-title">请求审计</div><div class="page-sub">查看 Grok Build 请求的账号、模型路由、状态、耗时与失败详情。敏感字段已脱敏。</div></div></div><section class="audit-card"><div class="summary"><span id="sum-total" class="pill">总请求 0</span><span id="sum-ok" class="pill">成功 0</span><span id="sum-fail" class="pill">失败 0</span></div><div class="audit-toolbar"><input id="q" placeholder="搜索模型、账号或错误"><select id="provider"><option value="">全部提供方</option><option value="build">Grok Build</option><option value="grok">Grok</option><option value="console">Console</option><option value="image">Image</option><option value="video">Video</option></select><select id="status"><option value="">全部状态</option><option value="200">成功 (200)</option><option value="401">401</option><option value="403">403</option><option value="429">429</option><option value="5xx">5xx</option></select><button id="reload">刷新</button></div><div style="overflow:auto"><table class="audit-table"><thead><tr><th>时间</th><th>提供方 / 操作</th><th>模型路由</th><th>账号</th><th>状态</th><th>耗时</th><th>详情</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="/static/js/i18n.js?v={{APP_VERSION}}"></script><script src="/static/js/auth.js?v={{APP_VERSION}}"></script><script src="/static/js/admin-header.js?v={{APP_VERSION}}"></script><script src="/static/js/footer.js?v={{APP_VERSION}}"></script><script>
const AUDIT_TEXT={"title": "\u8bf7\u6c42\u5ba1\u8ba1", "subtitle": "\u67e5\u770b Grok Build \u8bf7\u6c42\u7684\u8d26\u53f7\u3001\u6a21\u578b\u8def\u7531\u3001\u72b6\u6001\u3001\u8017\u65f6\u4e0e\u5931\u8d25\u8be6\u60c5\u3002\u654f\u611f\u5b57\u6bb5\u5df2\u8131\u654f\u3002", "total": "\u603b\u8bf7\u6c42", "success": "\u6210\u529f", "failed": "\u5931\u8d25", "search": "\u641c\u7d22\u6a21\u578b\u3001\u8d26\u53f7\u6216\u9519\u8bef", "all_providers": "\u5168\u90e8\u63d0\u4f9b\u65b9", "all_status": "\u5168\u90e8\u72b6\u6001", "ok": "\u6210\u529f", "refresh": "\u5237\u65b0", "time": "\u65f6\u95f4", "provider_op": "\u63d0\u4f9b\u65b9 / \u64cd\u4f5c", "model_route": "\u6a21\u578b\u8def\u7531", "account": "\u8d26\u53f7", "status": "\u72b6\u6001", "duration": "\u8017\u65f6", "detail": "\u8be6\u60c5", "upstream": "\u4e0a\u6e38", "request": "\u8bf7\u6c42", "response": "\u8fd4\u56de", "error": "\u9519\u8bef", "empty": "\u6682\u65e0\u5ba1\u8ba1\u8bb0\u5f55", "load_failed": "\u5ba1\u8ba1\u8bb0\u5f55\u52a0\u8f7d\u5931\u8d25\uff1a"};
const api=async path=>{const key=await adminKey.get();const r=await fetch('/admin/api/audits'+path,{headers:{Authorization:`Bearer ${key}`}});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||`HTTP ${r.status}`);return r.json()};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const preview=v=>{try{return JSON.stringify(v,null,2).slice(0,1200)}catch{return String(v||'')}};
async function load(){try{const q=encodeURIComponent(document.querySelector('#q').value.trim()),provider=encodeURIComponent(document.querySelector('#provider').value),status=encodeURIComponent(document.querySelector('#status').value);const [data,sum]=await Promise.all([api(`?limit=200&query=${q}&provider=${provider}&status=${status}`),api('/summary')]);document.querySelector('#sum-total').textContent=`${AUDIT_TEXT.total} ${sum.total||0}`;document.querySelector('#sum-ok').textContent=`${AUDIT_TEXT.success} ${sum.success||0}`;document.querySelector('#sum-fail').textContent=`${AUDIT_TEXT.failed} ${sum.failed||0}`;document.querySelector('#rows').innerHTML=(data.items||[]).map(x=>`<tr><td>${x.created_at?new Date(x.created_at).toLocaleString():'-'}</td><td>${esc(x.provider)}<br><span class="detail">${esc(x.operation)}</span></td><td>${esc(x.public_model)}<br><span class="detail">${AUDIT_TEXT.upstream} ${esc(x.upstream_model)}</span></td><td>${esc(x.account)}</td><td class="${x.status_code>=400?'status-bad':'status-ok'}">${esc(x.status_code)}</td><td>${esc(x.duration_ms)} ms</td><td><details><summary>${AUDIT_TEXT.detail}</summary><pre class="detail">${AUDIT_TEXT.request}
${esc(preview(x.request))}

${AUDIT_TEXT.response}
${esc(preview(x.response))}${x.error?'\n\n'+AUDIT_TEXT.error+'\n'+esc(x.error):''}</pre></details></td></tr>`).join('')||`<tr><td colspan="7" style="color:#888">${AUDIT_TEXT.empty}</td></tr>`}catch(e){document.querySelector('#rows').innerHTML=`<tr><td colspan="7" style="color:#b42318">${AUDIT_TEXT.load_failed}${esc(e.message)}</td></tr>`}}
document.querySelector('#reload').onclick=load;document.querySelector('#q').addEventListener('keydown',e=>{if(e.key==='Enter')load()});document.querySelector('#provider').onchange=load;document.querySelector('#status').onchange=load;(async()=>{await renderAdminHeader?.();await renderSiteFooter?.();load()})();
</script></body></html>
