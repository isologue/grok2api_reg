<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>请求审计</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{APP_VERSION}}">
  <style>
    body{background:#faf9f5}.page-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.page-title{font-size:22px;font-weight:700;line-height:1.2}.page-sub{margin-top:6px;color:var(--fg-muted);font-size:13px;line-height:1.6}.audit-card{background:#fff;border:1px solid #e8e3da;border-radius:12px;padding:16px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.pill{background:#f5f2ec;border-radius:999px;padding:5px 10px;font-size:12px;color:#5f584d}.audit-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.audit-toolbar input,.audit-toolbar select{min-height:34px;border:1px solid #ddd4c8;border-radius:8px;padding:0 10px;background:#fff;color:#333}.audit-toolbar input{min-width:260px}.audit-toolbar button{height:34px;border:0;border-radius:8px;padding:0 13px;background:#2f6fed;color:#fff;cursor:pointer}.audit-table{width:100%;border-collapse:collapse;font-size:13px}.audit-table th,.audit-table td{border-bottom:1px solid #f0ede8;padding:10px 8px;text-align:left;vertical-align:top;word-break:break-word}.audit-table th{font-size:11px;color:#888;font-weight:600;white-space:nowrap}.status-ok{color:#16824b}.status-bad{color:#b42318}.detail{max-width:360px;white-space:pre-wrap;color:#666}.audit-detail-btn{height:28px;padding:0 10px;border:1px solid #e1dbd0;border-radius:7px;background:#fff;color:#4d473f;font-size:12px;cursor:pointer;white-space:nowrap}.audit-detail-btn:hover{background:#f6f3ed;border-color:#d5ccbe}.audit-log-pre{margin:0;max-height:68vh;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#171717;color:#eee;border-radius:8px;padding:14px;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}.pagi{display:flex;align-items:center;gap:6px;padding:12px 0 0;justify-content:flex-end}.pagi-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:#8b8b8b}.pagi-page{font-variant-numeric:tabular-nums;white-space:nowrap}.pagi-btn{width:28px;height:28px;border:1px solid #e6e1d8;border-radius:8px;background:#fff;color:#666;font-size:16px;line-height:1;cursor:pointer}.pagi-btn:hover{background:#f6f3ed}.pagi-btn:disabled{opacity:.35;pointer-events:none}.audit-page-size{width:94px;height:28px;border-radius:999px;font:inherit;color:inherit;background:#fafafa;border:1px solid #ddd4c8}
  </style>
</head>
<body>
<div id="admin-header" data-active="/admin/audits"></div>
<main class="admin-main">
  <div class="page-hd"><div><div class="page-title">请求审计</div><div class="page-sub">查看每次请求使用的账号、模型路由、请求参数、上游返回和失败原因。敏感字段由后端脱敏后展示。</div></div><button type="button" class="page-action-btn" id="reload">刷新</button></div>
  <section class="audit-card"><div class="summary"><span id="sum-total" class="pill">总请求 0</span><span id="sum-ok" class="pill">成功 0</span><span id="sum-fail" class="pill">失败 0</span></div><div class="audit-toolbar"><input id="q" placeholder="搜索模型、账号或错误"><select id="provider"><option value="">全部提供方</option><option value="build">Grok Build</option><option value="grok">Grok</option><option value="console">Console</option><option value="image">Image</option><option value="video">Video</option></select><select id="status"><option value="">全部状态</option><option value="200">成功 (200)</option><option value="401">401 认证失败</option><option value="403">403 访问被拒</option><option value="429">429 限流/额度</option><option value="5xx">5xx 上游异常</option></select></div><div style="overflow:auto"><table class="audit-table"><thead><tr><th>时间</th><th>提供方 / 操作</th><th>模型路由</th><th>账号</th><th>状态</th><th>耗时</th><th>详情</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagi"><button type="button" class="pagi-btn" id="audit-prev" aria-label="上一页">‹</button><div class="pagi-meta"><span id="audit-page-info">第 0 / 0 页</span><select class="audit-page-size" id="audit-page-size" aria-label="每页数量"><option value="10">10 / 页</option><option value="20">20 / 页</option><option value="50">50 / 页</option><option value="100">100 / 页</option><option value="200">200 / 页</option><option value="500">500 / 页</option><option value="1000">1000 / 页</option><option value="2000">2000 / 页</option></select></div><button type="button" class="pagi-btn" id="audit-next" aria-label="下一页">›</button></div></section>
</main>
<div class="modal-overlay" id="modal-audit-detail" aria-hidden="true"><div class="modal" style="max-width:1040px"><div class="modal-title" id="audit-detail-title">请求审计详情</div><div class="dialog-body"><pre class="audit-log-pre" id="audit-detail-content"></pre></div><div class="dialog-actions"><button type="button" class="dialog-btn" id="audit-detail-close">关闭</button></div></div></div>
<script src="/static/js/auth.js?v={{APP_VERSION}}"></script><script src="/static/js/admin-header.js?v={{APP_VERSION}}"></script><script src="/static/js/footer.js?v={{APP_VERSION}}"></script>
<script>
const API='/admin/api/audits',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async path=>{const key=await adminKey.get(),r=await fetch(API+path,{headers:{Authorization:`Bearer ${key}`}});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||`HTTP ${r.status}`);return r.json()};
const PAGE_KEY='admin.request_audits.page_size.v2',OPTIONS=[10,20,50,100,200,500,1000,2000];let pageSize=Number(localStorage.getItem(PAGE_KEY))||10,page=1,total=0,totalPages=1;
const json=v=>{if(v==null||v==='')return '-';if(typeof v==='string'){try{return JSON.stringify(JSON.parse(v),null,2)}catch{return v}}try{return JSON.stringify(v,null,2)}catch{return String(v)}};
const statusMeaning=code=>({200:'成功',201:'已创建',400:'请求参数错误',401:'认证失败或账号令牌无效',403:'没有访问权限或被上游拒绝',404:'资源不存在',408:'请求超时',409:'请求冲突',429:'请求过于频繁，触发限流或额度不足',500:'服务内部错误',502:'上游网关错误',503:'上游暂时不可用',504:'上游响应超时'}[Number(code)]||((Number(code)>=500)?'上游服务异常':Number(code)>=400?'请求失败':'未知状态'));
const val=(o,...keys)=>{for(const k of keys){if(o&&o[k]!=null&&o[k]!=='')return o[k]}return null};
function textFrom(v){if(v==null)return '';if(typeof v==='string')return v;if(Array.isArray(v))return v.map(textFrom).filter(Boolean).join('\n');if(typeof v==='object'){for(const k of ['text','content','value','message','output_text','markdown']){if(v[k]!=null){const x=textFrom(v[k]);if(x)return x}}}return ''}
function collectMedia(v,out=[],path=''){if(v==null)return out;if(Array.isArray(v)){v.forEach((x,i)=>collectMedia(x,out,`${path}[${i}]`));return out}if(typeof v!=='object')return out;for(const [k,x] of Object.entries(v)){const lk=k.toLowerCase();if(typeof x==='string'&&(/url|uri|image|video|file/.test(lk)||/^https?:\/\//.test(x))){if(/^https?:\/\//.test(x)||x.startsWith('video_')||x.startsWith('file_'))out.push(`${path?path+'.':''}${k}: ${x}`)}else if(x&&typeof x==='object')collectMedia(x,out,`${path?path+'.':''}${k}`)}return [...new Set(out)]}
function requestHuman(req){if(req==null)return '未记录请求参数';let o=req;if(typeof req==='string'){try{o=JSON.parse(req)}catch{return req}}const lines=[];if(typeof o==='object'&&!Array.isArray(o)){const model=val(o,'model','model_id');if(model)lines.push(`模型：${model}`);const prompt=val(o,'prompt','message','input');if(typeof prompt==='string'&&prompt.trim())lines.push(`提示词/输入：\n${prompt.trim()}`);const messages=o.messages;if(Array.isArray(messages)&&messages.length){lines.push('对话内容：');messages.forEach((m,i)=>{const role=m?.role||'消息';const content=textFrom(m?.content??m?.message??m);lines.push(`  ${i+1}. ${role}：${content||json(m)}`)})}for(const [label,keys] of [['尺寸',['size','image_size']],['视频时长',['seconds','duration']],['质量',['quality','resolution']],['返回格式',['response_format']]]){const x=val(o,...keys);if(x!=null)lines.push(`${label}：${typeof x==='object'?json(x):x}`)}if(!lines.length)lines.push('请求内容：\n'+json(o));lines.push('完整请求参数：\n'+json(o));return lines.join('\n')}return json(o)}
function responseHuman(resp){if(resp==null)return '上游没有返回可解析内容';let o=resp;if(typeof resp==='string'){try{o=JSON.parse(resp)}catch{return `返回文本：\n${resp}`}}const lines=[];const text=textFrom(val(o,'output','text','content','message','response','result'));if(text)lines.push(`文本内容：\n${text}`);const media=collectMedia(o);if(media.length)lines.push('图片/视频/文件：\n'+media.join('\n'));const usage=val(o,'usage','token_usage');if(usage)lines.push('用量：\n'+json(usage));if(!lines.length)lines.push('返回内容：\n'+json(o));lines.push('完整上游返回：\n'+json(o));return lines.join('\n')}
function formatDetail(item){const code=item.status_code,created=item.created_at?new Date(item.created_at).toLocaleString():'-';const summary=['请求概览','────────────────────────','时间：'+created,'提供方：'+(item.provider||'-'),'操作：'+(item.operation||'-'),'账号：'+(item.account||'-'),'公共模型：'+(item.public_model||'-'),'上游模型：'+(item.upstream_model||'-'),'上游地址：'+(item.endpoint||'-'),'状态：'+(code??'-')+'（'+statusMeaning(code)+'）','耗时：'+(item.duration_ms??0)+' 毫秒','流式请求：'+(item.streaming?'是':'否'),'请求编号：'+(item.id||'-'),'','请求参数','────────────────────────',requestHuman(item.request),'','上游返回','────────────────────────',responseHuman(item.response)];if(item.error)summary.push('','错误信息','────────────────────────',`错误原因：${statusMeaning(code)}\n${item.error}`);return summary.join('\n')}
function renderRows(items){const body=document.querySelector('#rows');body.innerHTML=(items||[]).map(x=>`<tr><td>${esc(x.created_at?new Date(x.created_at).toLocaleString():'-')}</td><td>${esc(x.provider||'-')}<br><span class="detail">${esc(x.operation||'-')}</span></td><td>${esc(x.public_model||'-')}<br><span class="detail">上游：${esc(x.upstream_model||'-')}</span></td><td>${esc(x.account||'-')}</td><td class="${Number(x.status_code)>=400?'status-bad':'status-ok'}">${esc(x.status_code??'-')}<br><span class="detail">${esc(statusMeaning(x.status_code))}</span></td><td>${esc(x.duration_ms??0)} ms</td><td><button type="button" class="audit-detail-btn" data-audit-id="${esc(x.id)}">查看日志</button></td></tr>`).join('')||'<tr><td colspan="7" style="color:#888">暂无审计记录</td></tr>'}
function renderPage(){document.querySelector('#audit-page-info').textContent=`第 ${total?page:0} / ${totalPages} 页`;document.querySelector('#audit-prev').disabled=page<=1;document.querySelector('#audit-next').disabled=page>=totalPages}
function args(){return new URLSearchParams({page:String(page),page_size:String(pageSize),query:document.querySelector('#q').value.trim(),provider:document.querySelector('#provider').value,status:document.querySelector('#status').value}).toString()}
async function load(reset=false){if(reset)page=1;try{const [d,s]=await Promise.all([api('?'+args()),api('/summary')]);total=Number(d.total||0);totalPages=Math.max(1,Number(d.total_pages||1));page=Math.min(Math.max(1,Number(d.page||page)),totalPages);document.querySelector('#sum-total').textContent=`总请求 ${s.total||0}`;document.querySelector('#sum-ok').textContent=`成功 ${s.success||0}`;document.querySelector('#sum-fail').textContent=`失败 ${s.failed||0}`;renderRows(d.items);renderPage()}catch(e){document.querySelector('#rows').innerHTML=`<tr><td colspan="7" style="color:#b42318">加载失败：${esc(e.message)}</td></tr>`;total=0;totalPages=1;renderPage()}}
async function openDetail(id){const modal=document.querySelector('#modal-audit-detail'),title=document.querySelector('#audit-detail-title'),content=document.querySelector('#audit-detail-content');title.textContent='请求审计详情';content.textContent='正在加载完整日志…';modal.classList.add('open');modal.setAttribute('aria-hidden','false');try{const item=await api('/'+encodeURIComponent(id));title.textContent=`请求审计详情 - ${item.id||id}`;content.textContent=formatDetail(item)}catch(e){content.textContent='加载审计详情失败：'+e.message}}
document.querySelector('#rows').addEventListener('click',e=>{const b=e.target.closest('[data-audit-id]');if(b)openDetail(b.dataset.auditId)});document.querySelector('#reload').onclick=()=>load();document.querySelector('#q').onkeydown=e=>{if(e.key==='Enter')load(true)};document.querySelector('#provider').onchange=()=>load(true);document.querySelector('#status').onchange=()=>load(true);document.querySelector('#audit-prev').onclick=()=>{if(page>1){page--;load()}};document.querySelector('#audit-next').onclick=()=>{if(page<totalPages){page++;load()}};const sel=document.querySelector('#audit-page-size');sel.value=String(OPTIONS.includes(pageSize)?pageSize:10);sel.onchange=e=>{pageSize=Number(e.target.value)||10;localStorage.setItem(PAGE_KEY,String(pageSize));load(true)};document.querySelector('#audit-detail-close').onclick=()=>{const m=document.querySelector('#modal-audit-detail');m.classList.remove('open');m.setAttribute('aria-hidden','true')};document.querySelector('#modal-audit-detail').onclick=e=>{if(e.target===e.currentTarget)document.querySelector('#audit-detail-close').click()};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#audit-detail-close').click()});
(async()=>{await renderAdminHeader?.();await renderSiteFooter?.();const key=await adminKey.get();if(!key||!await verifyKey('/admin/api/verify',key).catch(()=>false)){location.href='/admin/login';return}await load()})();
</script>
</body></html>
