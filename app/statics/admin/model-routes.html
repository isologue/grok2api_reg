<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>模型路由</title><link rel="icon" href="/favicon.ico?v={{APP_VERSION}}"><link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-sans/style.css" rel="stylesheet"><link href="/static/css/app.css?v={{APP_VERSION}}" rel="stylesheet"><style>body{background:#FAF9F5}.page-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:14px}.page-title{font-size:22px;font-weight:700;line-height:1.2}.page-sub{font-size:13px;color:var(--fg-muted);margin-top:5px}.page-actions,.route-toolbar,.route-pagination{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.route-toolbar{justify-content:space-between;margin-bottom:14px}.route-toolbar input{width:min(420px,100%);min-height:34px;border:1px solid #ddd4c8;border-radius:8px;padding:0 10px;background:#fff}.page-action-btn,.route-toolbar button{border:0;border-radius:8px;background:#222;color:#fff;padding:8px 12px;cursor:pointer;font-size:13px}.table-wrap{overflow:auto;border:1px solid var(--border,#e8e3da);border-radius:10px;background:#fff}.table-wrap table{width:100%;border-collapse:collapse;font-size:13px}.table-wrap th,.table-wrap td{padding:11px 10px;border-bottom:1px solid #f0ede8;text-align:left;vertical-align:top}.table-wrap th{font-size:11px;color:#888;font-weight:600}.empty-row{text-align:center;color:var(--fg-muted)}.route-pagination{justify-content:flex-end;margin-top:12px}.route-pagination select{width:auto;min-width:82px}.muted{color:var(--fg-muted);font-size:12px}</style></head><body><div id="admin-header"></div><main class="admin-main"><div class="page-hd"><div><div class="page-title">模型路由</div><div class="page-sub">统一查看普通账号模型与 Grok Build OAuth 模型路由。</div></div><div class="page-actions"><button class="page-action-btn" id="route-add">添加 Build 路由</button><button class="page-action-btn" id="route-reload">刷新</button></div></div><div class="route-toolbar"><input id="route-query" placeholder="搜索公开模型、上游模型或来源"><button id="route-search">查询</button></div><div class="table-wrap"><table><thead><tr><th>公开模型 ID</th><th>上游模型</th><th>来源</th><th>当前可用</th><th>状态</th><th>操作</th></tr></thead><tbody id="route-tbody"><tr><td colspan="6" class="empty-row">暂无符合条件的模型路由</td></tr></tbody></table></div><div class="route-pagination"><button type="button" class="pagi-btn" id="route-prev">上一页</button><span id="route-page-info" class="muted"></span><button type="button" class="pagi-btn" id="route-next">下一页</button><select class="input" id="route-page-size"><option value="10">10 / 页</option><option value="20">20 / 页</option><option value="50">50 / 页</option><option value="100">100 / 页</option><option value="200">200 / 页</option><option value="500">500 / 页</option><option value="1000">1000 / 页</option></select></div></main><div class="modal-overlay" id="route-modal"><div class="modal" style="max-width:520px"><div class="modal-title">Build 模型路由</div><div class="dialog-body"><div class="dialog-field"><span class="dialog-label">公开模型 ID</span><input class="input" id="route-public" placeholder="grok-4.5-fast"></div><div class="dialog-field"><span class="dialog-label">上游模型</span><input class="input" id="route-upstream" placeholder="grok-4.5"></div><div class="dialog-field"><span class="dialog-label">状态</span><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="route-enabled" checked><span>启用此路由</span></label></div></div><div class="dialog-actions"><button class="dialog-btn" id="route-cancel">取消</button><button class="dialog-btn dialog-btn-primary" id="route-save">保存</button></div></div></div><script src="/static/js/i18n.js?v={{APP_VERSION}}"></script><script src="/static/js/auth.js?v={{APP_VERSION}}"></script><script src="/static/js/admin-header.js?v={{APP_VERSION}}"></script><script src="/static/js/footer.js?v={{APP_VERSION}}"></script><script>const T={"title": "\u6a21\u578b\u8def\u7531", "subtitle": "\u7edf\u4e00\u67e5\u770b\u666e\u901a\u8d26\u53f7\u6a21\u578b\u4e0e Grok Build OAuth \u6a21\u578b\u8def\u7531\u3002", "add": "\u6dfb\u52a0 Build \u8def\u7531", "refresh": "\u5237\u65b0", "search": "\u641c\u7d22\u516c\u5f00\u6a21\u578b\u3001\u4e0a\u6e38\u6a21\u578b\u6216\u6765\u6e90", "query": "\u67e5\u8be2", "public": "\u516c\u5f00\u6a21\u578b ID", "upstream": "\u4e0a\u6e38\u6a21\u578b", "source": "\u6765\u6e90", "available": "\u5f53\u524d\u53ef\u7528", "status": "\u72b6\u6001", "actions": "\u64cd\u4f5c", "ordinary_pool": "\u666e\u901a\u8d26\u53f7\u6c60", "manual": "\u624b\u5de5", "discovered": "\u81ea\u52a8\u53d1\u73b0", "enabled": "\u5df2\u542f\u7528", "disabled": "\u5df2\u7981\u7528", "yes": "\u53ef\u7528", "no": "\u6682\u65e0\u53ef\u7528\u8d26\u53f7", "read_only": "\u7cfb\u7edf\u8def\u7531", "edit": "\u7f16\u8f91", "delete": "\u5220\u9664", "empty": "\u6682\u65e0\u7b26\u5408\u6761\u4ef6\u7684\u6a21\u578b\u8def\u7531", "page": "\u7b2c", "page_suffix": "\u9875", "prev": "\u4e0a\u4e00\u9875", "next": "\u4e0b\u4e00\u9875", "per_page": "/ \u9875", "modal_title": "Build \u6a21\u578b\u8def\u7531", "enable_route": "\u542f\u7528\u6b64\u8def\u7531", "cancel": "\u53d6\u6d88", "save": "\u4fdd\u5b58", "fill": "\u8bf7\u586b\u5199\u516c\u5f00\u6a21\u578b ID \u548c\u4e0a\u6e38\u6a21\u578b", "save_ok": "Build \u6a21\u578b\u8def\u7531\u5df2\u4fdd\u5b58", "save_fail": "\u4fdd\u5b58\u5931\u8d25\uff1a", "delete_confirm": "\u786e\u5b9a\u5220\u9664 Build \u6a21\u578b\u8def\u7531", "delete_fail": "\u5220\u9664\u5931\u8d25\uff1a", "load_fail": "\u6a21\u578b\u8def\u7531\u52a0\u8f7d\u5931\u8d25\uff1a"};const ROUTE_API='/admin/api';const ROUTE_PAGE_SIZE_KEY = 'admin.model_routes.page_size';
const ROUTE_PAGE_SIZE_OPTIONS = [10, 20, 50, 100, 200, 500, 1000];
let rows=[],page=1,pageSize=Number(localStorage.getItem(ROUTE_PAGE_SIZE_KEY)) || 20,totalPages=1;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async(method,path,body)=>{const key=await adminKey.get();const r=await fetch(ROUTE_API+path,{method,headers:{...(body!=null&&{'Content-Type':'application/json'}),Authorization:`Bearer ${key}`},...(body!=null&&{body:JSON.stringify(body)})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||`HTTP ${r.status}`)}return r.json()};function render(){const body=document.getElementById('route-tbody'),info=document.getElementById('route-page-info'),prev=document.getElementById('route-prev'),next=document.getElementById('route-next');body.innerHTML=rows.length?rows.map(item=>{const ordinary=item.route_kind==='ordinary';const source=ordinary?`${T.ordinary_pool}${item.account_pool?` (${esc(item.account_pool)})`:''}`:(item.origin==='manual'?T.manual:T.discovered);const actions=ordinary?`<span class="muted">${T.read_only}</span>`:`<button class="pagi-btn" onclick="editRoute('${esc(item.public_id)}')">${T.edit}</button> <button class="pagi-btn" onclick="deleteRoute('${esc(item.public_id)}')">${T.delete}</button>`;return `<tr><td><code>${esc(item.public_id)}</code></td><td><code>${esc(item.upstream_model)}</code></td><td>${source}</td><td>${item.available?T.yes:T.no}</td><td>${item.enabled?T.enabled:T.disabled}</td><td>${actions}</td></tr>`}).join(''):`<tr><td colspan="6" class="empty-row">${T.empty}</td></tr>`;info.textContent=`${T.page} ${page} / ${totalPages} ${T.page_suffix}`;prev.disabled=page<=1;next.disabled=page>=totalPages}async function load(reset=false){if(reset)page=1;const q=encodeURIComponent(document.getElementById('route-query').value.trim());try{const data=await api('GET',`/build/model-routes?query=${q}&page=${page}&page_size=${pageSize}`);rows=Array.isArray(data.items)?data.items:[];page=data.page||1;totalPages=data.total_pages||1;render()}catch(e){document.getElementById('route-tbody').innerHTML=`<tr><td colspan="6" class="empty-row" style="color:#b42318">${T.load_fail}${esc(e.message)}</td></tr>`}}function openModal(){document.getElementById('route-modal').classList.add('open')}function closeModal(){document.getElementById('route-modal').classList.remove('open')}function editRoute(id=''){const item=rows.find(x=>x.public_id===id);document.getElementById('route-public').value=item?.public_id||'';document.getElementById('route-public').readOnly=Boolean(item);document.getElementById('route-upstream').value=item?.upstream_model||'';document.getElementById('route-enabled').checked=item?.enabled??true;openModal()}async function saveRoute(){const publicId=document.getElementById('route-public').value.trim(),upstream=document.getElementById('route-upstream').value.trim(),enabled=document.getElementById('route-enabled').checked;if(!publicId||!upstream)return alert(T.fill);try{await api('POST','/build/model-routes',{public_id:publicId,upstream_model:upstream,enabled});closeModal();await load();}catch(e){alert(`${T.save_fail}${e.message}`)}}async function deleteRoute(id){if(!confirm(`${T.delete_confirm} ${id} ?`))return;try{await api('DELETE',`/build/model-routes/${encodeURIComponent(id)}`);await load()}catch(e){alert(`${T.delete_fail}${e.message}`)}}document.getElementById('route-add').onclick=()=>editRoute();document.getElementById('route-reload').onclick=()=>load();document.getElementById('route-search').onclick=()=>load(true);document.getElementById('route-query').addEventListener('keydown',e=>{if(e.key==='Enter')load(true)});document.getElementById('route-prev').onclick=()=>{if(page>1){page--;load()}};document.getElementById('route-next').onclick=()=>{if(page<totalPages){page++;load()}};const routePageSizeSelect=document.getElementById('route-page-size');routePageSizeSelect.value=String(ROUTE_PAGE_SIZE_OPTIONS.includes(pageSize)?pageSize:20);routePageSizeSelect.onchange=e=>{pageSize=ROUTE_PAGE_SIZE_OPTIONS.includes(Number(e.target.value))?Number(e.target.value):20;localStorage.setItem(ROUTE_PAGE_SIZE_KEY,String(pageSize));load(true)};document.getElementById('route-cancel').onclick=closeModal;document.getElementById('route-save').onclick=saveRoute;(async()=>{await renderAdminHeader?.();await renderSiteFooter?.();const key=await adminKey.get();if(!key||!await verifyKey(ROUTE_API+'/verify',key).catch(()=>false)){location.href='/admin/login';return}await load()})();</script></body></html>
